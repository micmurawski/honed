[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "honed"
version = "0.3.0"
description = "Agent-independent session indexing, reflection, and configuration adaptation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "jsonschema>=4.23,<5",
    "mcp>=2.2,<3",  # The tools reflectors, curators and mergers hand their work in through.
    "numpy>=1.26",  # Session archetypes in `honed sessions graph aeg`.
]

[project.scripts]
honed = "honed.cli:main"
hnd = "honed.cli:main"  # Short form.

[project.urls]
Repository = "https://github.com/micmurawski/honed"
Documentation = "https://micmurawski.github.io/honed/"
Issues = "https://github.com/micmurawski/honed/issues"

[tool.setuptools.packages.find]
include = ["honed*"]

[tool.setuptools.package-data]
"honed.flow" = ["viz.css", "viz.js"]
"honed.resources" = ["report.html"]
"honed.ui" = ["theme.css", "theme.js"]
"honed.evolve" = ["skills/evolve/SKILL.md", "skills/evolve/evolve.py", "skills/evolve/prompts/*.md",
                   "skills/reflect/SKILL.md"]

[project.optional-dependencies]
mcp = []  # Now a dependency; kept so `honed[mcp]` still installs.
aeg = []  # Now a dependency; kept so `honed[aeg]` still installs. pyarrow adds Parquet tables.
docs = ["mkdocs>=1.6,<2"]
antigravity = ["google-antigravity==0.1.19"]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "build", "dist", "*.egg", "node_modules", "venv", "fastapi"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tests/fastapi"]

[tool.ruff.lint]
extend-select = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["honed"]
# honed.flow was copied from the old package as it was and is not typed yet.
# honed/evolve/skills/evolve/evolve.py is the recipe users edit, installed as a script, not library code.
exclude = ["honed/flow/", "honed/evolve/skills/"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["honed.flow", "honed.flow.*"]  # Followed from honed.evolve, but not typed yet.
ignore_errors = true
